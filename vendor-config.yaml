# Install scripts keep yarn's exit status: a pipe into grep reported grep's, so a failed install passed.
# vendor-builder.js discards their stdout, so the log goes to stderr, whole, only when yarn fails.
vendors:
  - name: "@cosmjs"
    path: "vendor/cosmjs"
    workspace: true
    install:
      required: true
      script: "yarn install --silent > yarn-install.log 2>&1 && rm -f yarn-install.log || { cat yarn-install.log >&2; rm -f yarn-install.log; exit 1; }"
      cleanCache: true
    build:
      required: true
      script: "yarn build"
    pack:
      include:
        - "stargate"
        - "tendermint-rpc"

  - name: "@subql"
    path: "vendor/subql"
    workspace: true
    install:
      required: true
      script: "yarn install --silent > yarn-install.log 2>&1 && rm -f yarn-install.log || { cat yarn-install.log >&2; rm -f yarn-install.log; exit 1; }"
      cleanCache: true
    build:
      required: true
      script: "yarn build"
    dependencies:
      - "@cosmjs"

  - name: "simdjson"
    path: "vendor/simdjson"
    workspace: false
    install:
      required: true
      script: "npm install"

  - name: "@subql-cosmos"
    path: "vendor/subql-cosmos"
    workspace: true
    install:
      required: true
      script: "yarn install --silent > yarn-install.log 2>&1 && rm -f yarn-install.log || { cat yarn-install.log >&2; rm -f yarn-install.log; exit 1; }"
      cleanCache: true
    build:
      required: true
      script: "yarn build"
    packageResolution:
      "node-cosmos": "node"
      "types-cosmos": "types"
    dependencies:
      - "@cosmjs"
      - "@subql"
      - "simdjson"
