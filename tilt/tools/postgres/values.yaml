global:
  postgresql:
    auth:
      postgresPassword: "postgres"
  # Chart blocks non-standard images (NOTES.txt verification). Required because we
  # repoint to bitnamilegacy below. See bitnami/charts#30850.
  security:
    allowInsecureImages: true
# Bitnami removed versioned tags from docker.io/bitnami on 2025-09-29; the chart's
# default image no longer resolves. Point at the legacy repo to unblock local dev.
# NOTE: bitnamilegacy receives no updates — temporary until we move off the Bitnami chart.
image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.5.0-debian-12-r16
primary:
  # Explicit resources instead of the chart's "nano" preset (192Mi limit): the
  # beta (pocket-lego-testnet) genesis account bulk insert got the database
  # OOMKilled at 192Mi; with these limits it peaked at ~1.3Gi (cgroup memory.peak).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  initdb:
    scripts:
      01-extensions.sql: |
        CREATE EXTENSION IF NOT EXISTS btree_gist;
        CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Delete
