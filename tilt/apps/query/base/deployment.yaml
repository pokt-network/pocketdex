apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: explorer
    component: query
  name: query
spec:
  progressDeadlineSeconds: 15
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: explorer
      component: query
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: explorer
        component: query
    spec:
      containers:
        - name: query
          # --query-limit: the row cap of a money catalog list (@simpleCollections only, smartTags.ts), and also the
          # default "first" of every entity connection that does not send one, so it is kept at 1000; larger answers
          # use the <function>_json variants. The consumers' connections without "first" were reviewed for this
          # (.local/consumers/CONSUMERS-SUMMARY.md §4). --query-timeout 20000: 20 s per GraphQL query (the money catalog's
          # largest calls take ~1.3 s in tilt). Production sets both in pnf-ops.
          args:
            - exec /sbin/tini -- /bin/run $(cat /mnt/config/args.txt) --query-timeout=20000 --query-limit=1000 -f /app
          command:
            - /bin/sh
            - -c
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: "user"
                  name: "db-credentials"
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  key: "password"
                  name: "db-credentials"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  key: "database"
                  name: "db-credentials"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  key: "host"
                  name: "db-credentials"
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  key: "port"
                  name: "db-credentials"
          image: subquerynetwork/subql-query:v2.22.2
          imagePullPolicy: IfNotPresent
          resources: { }
          volumeMounts:
            - mountPath: /mnt/config
              name: config-volume
      dnsPolicy: ClusterFirst
      initContainers:
        - name: init-args
          # No --subscription, as in production: subql-query 2.22.2 PgSubscriptionPlugin builds a field for
          # every table and ignores @omit, so the hidden money tables make the schema build fail.
          command:
            - /bin/sh
            - -c
            - echo "--name=${DB_SCHEMA} --playground --indexer=${INDEXER_URL} --log-level=info --query-complexity=100 --query-depth-limit=8"
              > /mnt/config/args.txt
          env:
            - name: DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  key: "schema"
                  name: "db-credentials"
            - name: INDEXER_URL
              valueFrom:
                configMapKeyRef:
                  key: "indexer_endpoint"
                  name: "pokt-shannon"
          image: subquerynetwork/subql-query:v2.22.2
          imagePullPolicy: IfNotPresent
          resources: { }
          volumeMounts:
            - mountPath: /mnt/config
              name: config-volume
      restartPolicy: Always
      securityContext: { }
      terminationGracePeriodSeconds: 20
      volumes:
        - emptyDir: { }
          name: config-volume
