name: CI
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  draft:
    name: 'Check Draft State'
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo ${{ github.event.pull_request.draft != true }}
          echo "Pull Request is not draft, this workflow need continue."

  on-docker:
    name: 'Docker'
    uses: './.github/workflows/ci-docker.yml'
    needs: draft
    secrets: inherit
    strategy:
      fail-fast: false
      # use a matrix here to speed up the process of build both docker images.
      matrix:
        environment: [ "production", "development" ]
        platform:
          - "linux/amd64"
          # Disabled this until we research why this takes more than 1 hour to build something that
          # take less than 10 minutes on linux/amd64
          # - "linux/arm64"
    with:
      env: ${{ matrix.environment }}
      platform: ${{ matrix.platform }}
      # Publish only the production image, and only for commits landing on main.
      # Pull requests build without ever touching the registry credentials.
      push: ${{ matrix.environment == 'production' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  money-db:
    # The settlement money writer and its golden fixtures against a real PostgreSQL: the unit tests in the
    # image build cannot reach a database.
    name: 'Money tables (PostgreSQL)'
    needs: draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
      - name: Build the development image
        run: docker build -f tilt/docker/indexer.dockerfile --build-arg BUILD_MODE=development -t pocketdex-ci .
      - name: Run the money writer test
        run: >-
          docker run --rm --network host --entrypoint yarn
          -v "$PWD/test:/home/app/test:ro"
          -e MONEY_TEST_PG=postgres://postgres:postgres@127.0.0.1:5432/postgres
          pocketdex-ci test:money
