on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      platform:
        type: string
        required: true
      push:
        description: >-
          Publish the built image to Harbor. The caller only enables this for pushes
          landing on main, so pull request runs -- including runs from forks, which
          GitHub never grants secrets to -- stay build-only.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: "CI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Ensures full history
          submodules: recursive # Checks out submodules at the exact commit
          set-safe-directory: true # Ensures Git commands run without permission issues

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # The registry host and project are vars, not secrets: they are not credentials,
      # and masking them turned a malformed tag into an unreadable "***/***" error.
      # The robot account name and token stay secrets.
      - name: Login to Harbor
        if: ${{ inputs.push }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Tag only `sha-<short>`, matching the convention already in pnf/pocketdex.
      # No moving `latest` tag: every artifact in that repository is explicitly
      # pinned, and release tags like 0.1.34-rc2 are published by hand.
      - name: Docker metadata
        if: ${{ inputs.push }}
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/pocketdex
          flavor: |
            latest=false
          tags: |
            type=sha,format=short

      # production mode
      - name: Build Production
        uses: docker/build-push-action@v6.14.0
        if: ${{ inputs.env == 'production' }}
        with:
          file: tilt/docker/indexer.dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            BUILD_MODE=production
          platforms: ${{ inputs.platform }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Harbor lists buildkit attestation manifests as a separate untagged
          # "unknown/unknown" artifact next to the image, so emit a plain manifest.
          provenance: false
          sbom: false
